[project]
name = "sewasmart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nadim Hossain", email = "nadimhbd11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "seaborn>=0.13.2",
]

[project.scripts]
sewasmart = "sewasmart:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
